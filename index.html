<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#004D7F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>호민쌤단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2EFF6; --surface:#FFFFFF; --surface-2:#FAF8FC; --ink:#1D1526; --muted:#6B6178; --line:#E3DDEB;
  --accent:#6B2FA8; --accent-soft:#F0E6FA; --accent-ink:#4A1D78;
  --good:#186B50; --good-soft:#DDF0E8; --good-line:#8FCFB6; --bad:#A32744; --bad-soft:#FBE3E9; --bad-line:#E7A2B2; --gold:#96660F;
  --shadow:0 1px 2px rgba(29,21,38,.06), 0 12px 28px -14px rgba(29,21,38,.22);
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  --display:"Fraunces",Georgia,"Times New Roman",serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131020; --surface:#1E1830; --surface-2:#241D38; --ink:#ECE5F4; --muted:#A497B6; --line:#332944;
  --accent:#BC91F2; --accent-soft:#2A2044; --accent-ink:#D9BEFF; --good:#63D6A7; --good-soft:#16362B; --good-line:#2E6B54;
  --bad:#F38CA3; --bad-soft:#3A1A24; --bad-line:#7A3247; --gold:#E2B462; --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 34px -18px rgba(0,0,0,.8);}}
:root[data-theme="dark"]{
  --bg:#131020; --surface:#1E1830; --surface-2:#241D38; --ink:#ECE5F4; --muted:#A497B6; --line:#332944;
  --accent:#BC91F2; --accent-soft:#2A2044; --accent-ink:#D9BEFF; --good:#63D6A7; --good-soft:#16362B; --good-line:#2E6B54;
  --bad:#F38CA3; --bad-soft:#3A1A24; --bad-line:#7A3247; --gold:#E2B462; --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 34px -18px rgba(0,0,0,.8);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none !important}
.wrap{max-width:600px;margin:0 auto;padding:22px 18px 56px;display:flex;flex-direction:column;gap:18px;min-height:100dvh}
.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0;cursor:pointer}
.brand em{font-style:normal;color:var(--accent)}
.tag{font-family:var(--display);font-size:13px;color:var(--muted);letter-spacing:.03em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.pad{padding:20px}
.label{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface-2);border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 15px;font-size:14.5px;font-weight:500;transition:.15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"],:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#1A1327}
.hint{font-size:13px;color:var(--muted);margin:0}
.search{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);margin:2px 0 4px}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.install{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:14px}
.install img{width:44px;height:44px;border-radius:11px;flex:none}
.install .txt{flex:1;font-size:13px;line-height:1.45;color:var(--muted)}.install .txt b{display:block;font-size:14px;color:var(--ink);font-weight:600}
.install button{flex:none;font:inherit;font-weight:600;font-size:13px;padding:8px 12px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.install button.x{background:transparent;color:var(--muted);border-color:transparent;padding:8px 6px}
@media (display-mode: standalone){.install{display:none}}
.field{display:flex;flex-direction:column;gap:9px}
.setup{display:flex;flex-direction:column;gap:18px}
.primary{width:100%;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:600}
:root[data-theme="dark"] .primary,:root:not([data-theme="light"]) .primary{color:#171026}
.primary:active{transform:translateY(1px)}
.ghost{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14.5px;font-weight:600}
/* 자료 목록 */
.lib{display:flex;flex-direction:column;gap:12px}
.mat{display:flex;flex-direction:column;gap:5px;text-align:left;padding:18px 20px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;box-shadow:var(--shadow);transition:border-color .15s}
.mat:hover{border-color:var(--accent)}
.mat .mt{font-size:18px;font-weight:700;letter-spacing:-.01em}
.mat .ms{font-size:13.5px;color:var(--muted)}
.mat .mn{font-family:var(--mono);font-size:12.5px;color:var(--accent)}
.sectitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sectitle h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.sectitle .sub{font-size:13px;color:var(--muted)}
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:0;font-size:14px}
.bestline{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.bestline b{font-family:var(--mono);color:var(--gold);font-size:15px}
/* 학습 목록 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wl{display:flex;flex-direction:column}
.wi{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 4px;border-top:1px solid var(--line);align-items:baseline;cursor:pointer}
.wi:first-child{border-top:0}
.wi .w{font-family:var(--display);font-weight:700;font-size:18px}
.wi .p{font-family:var(--mono);font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;justify-self:end}
.wi .k{grid-column:1/-1;font-size:15px}
.wi .e{grid-column:1/-1;font-family:var(--display);font-size:13.5px;color:var(--muted);line-height:1.4}
.wi.hide .k,.wi.hide .e{display:none}
.wi .g{grid-column:1/-1;font-size:11px;color:var(--muted);letter-spacing:.05em}
/* 플래시카드 */
.fc{min-height:260px;padding:30px 22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.fc .qkind{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fc .big{font-family:var(--display);font-weight:700;font-size:clamp(30px,8vw,44px);line-height:1.15;margin:0;text-wrap:balance;word-break:break-word}
.fc .ko{font-size:clamp(20px,5.4vw,26px);font-weight:500;margin:0;line-height:1.35}
.fc .def{font-family:var(--display);font-size:16px;color:var(--muted);margin:0;line-height:1.45;text-wrap:balance}
.fc .tap{font-size:12.5px;color:var(--muted)}
.fcrow{display:flex;gap:9px}
.fcrow button{flex:1;padding:13px;border-radius:12px;font-weight:600;font-size:15px;border:1.5px solid var(--line);background:var(--surface)}
.fcrow button.know{border-color:var(--good-line);background:var(--good-soft);color:var(--good)}
.fcrow button.dont{border-color:var(--bad-line);background:var(--bad-soft);color:var(--bad)}
/* 퀴즈 */
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 3px}
.counter{font-family:var(--mono);font-size:13px;color:var(--muted)}
.stats{display:flex;align-items:center;gap:12px}
.score{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--gold)}
.hearts{letter-spacing:2px;font-size:14px}
.combo{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-family:var(--mono)}
.track{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.track>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.timer{height:3px;border-radius:99px;overflow:hidden;margin-top:5px}
.timer>i{display:block;height:100%;background:var(--accent);border-radius:99px;opacity:.32}
.qcard{padding:32px 22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:14px}
.qkind{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
.qword{font-family:var(--display);font-weight:700;font-size:clamp(30px,8.2vw,46px);line-height:1.15;letter-spacing:-.018em;margin:0;text-wrap:balance;word-break:break-word}
.qko{font-size:clamp(21px,5.6vw,28px);font-weight:500;margin:0;line-height:1.35;text-wrap:balance}
.qdef{font-family:var(--display);font-size:clamp(18px,4.8vw,23px);font-weight:500;margin:0;line-height:1.4;text-wrap:balance}
.qhint{font-family:var(--display);font-size:14.5px;color:var(--muted);margin:0;line-height:1.4}
.qpos{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.answers{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.ans{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;font-size:16px;line-height:1.4;transition:.14s}
.ans:hover:not(:disabled){border-color:var(--accent)}
.ans:disabled{cursor:default}
.key{flex:none;width:24px;height:24px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.ans.is-good{background:var(--good-soft);border-color:var(--good-line)} .ans.is-good .key{background:var(--good);border-color:var(--good);color:var(--surface)}
.ans.is-bad{background:var(--bad-soft);border-color:var(--bad-line)} .ans.is-bad .key{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.spellrow{display:flex;gap:9px}
.spellrow input{flex:1;font-family:var(--display);font-size:22px;font-weight:600;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.spellrow input:focus{outline:none;border-color:var(--accent)}
.spellrow button{flex:none;padding:0 20px;border-radius:12px;border:1.5px solid var(--accent);background:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .spellrow button,:root:not([data-theme="light"]) .spellrow button{color:#171026}
.blanks{font-family:var(--mono);font-size:19px;letter-spacing:.22em;color:var(--muted)}
.feedback{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.verdict{display:flex;flex-direction:column;gap:5px;padding:14px 16px;border-radius:12px;border:1.5px solid}
.verdict.good{background:var(--good-soft);border-color:var(--good-line)} .verdict.bad{background:var(--bad-soft);border-color:var(--bad-line)}
.verdict .vt{font-size:13px;font-weight:600;letter-spacing:.05em} .verdict.good .vt{color:var(--good)} .verdict.bad .vt{color:var(--bad)}
.verdict .vb{font-size:15.5px} .verdict .vb b{font-family:var(--display);font-weight:700;font-size:18px}
.verdict .ve{font-family:var(--display);font-size:13.5px;color:var(--muted)}
.next{width:100%;background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600}
.final{text-align:center;padding:30px 22px;display:flex;flex-direction:column;gap:6px;align-items:center}
.final .big{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;color:var(--accent)}
.final .sub{font-size:14.5px;color:var(--muted)}
.newbest{font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--gold);font-family:var(--mono)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.cell{background:var(--surface);padding:14px 8px;text-align:center}
.cell .n{font-family:var(--mono);font-size:21px;font-weight:500} .cell .t{font-size:11.5px;color:var(--muted);letter-spacing:.05em}
.wrow{display:flex;gap:12px;padding:11px 2px;border-top:1px solid var(--line);align-items:baseline;flex-wrap:wrap}
.wrow:first-child{border-top:0}
.wrow .ww{font-family:var(--display);font-weight:700;font-size:17.5px;flex:none;min-width:36%}
.wrow .wk{font-size:14.5px;color:var(--muted)} .wrow .we{font-family:var(--display);font-size:13px;color:var(--muted);flex-basis:100%}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}
.btnrow button{flex:1 1 140px;padding:13px;border-radius:12px;font-weight:600;font-size:15px;border:1.5px solid var(--line);background:var(--surface)}
.btnrow button.primary{flex:1 1 140px;padding:13px;font-size:15px;border-radius:12px;width:auto}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:auto;padding-top:8px;font-family:var(--display)}
.pop{animation:pop .26s ease} @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.track>i{transition:none}}
</style>

<div class="wrap">
  <header class="masthead">
    <h1 class="brand" id="brand" title="처음으로">호민쌤<em>단어장</em></h1>
    <span class="tag">Ryan's Edge English</span>
  </header>

  <!-- 홈 화면 설치 안내 (앱으로 설치되면 자동으로 숨김) -->
  <div class="install" id="installBar" hidden><img src="icon-512.png" alt=""><div class="txt" id="installTxt"></div><button id="installBtn" hidden>앱 설치</button><button class="x" id="installX" title="닫기">✕</button></div>
  <!-- 자료 목록 -->
  <section id="home" class="lib"></section>

  <!-- 자료 설정 -->
  <section id="setup" class="card pad setup" hidden>
    <div class="sectitle"><button class="back" id="back1">‹ 목록</button><h2 id="mTitle"></h2><span class="sub" id="mSub"></span></div>
    <div class="field"><span class="label">범위</span><div class="chips" id="pickGroup"></div></div>
    <div class="field"><span class="label">활동</span><div class="chips" id="pickAct"></div><p class="hint" id="actHint"></p></div>
    <div id="testOpts" class="setup" style="gap:18px">
      <div class="field"><span class="label">문제 방식</span><div class="chips" id="pickMode"></div><p class="hint" id="modeHint"></p></div>
      <div class="field"><span class="label">문항 수</span><div class="chips" id="pickLen"></div></div>
      <div class="field"><span class="label">제한 시간</span><div class="chips" id="pickTimer"></div></div>
      <div class="bestline" id="bestLine"></div>
    </div>
    <button class="primary" id="startBtn">시작하기</button>
  </section>

  <!-- 학습: 목록 -->
  <section id="study" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="sectitle"><button class="back" id="back2">‹ 설정</button><h2 id="sTitle"></h2></div>
    <div class="toolbar"><button class="ghost" id="toggleAll">뜻 모두 가리기</button><button class="ghost" id="shuffleList">순서 섞기</button><span class="hint" id="sCount"></span></div>
    <div class="card pad wl" id="wordList"></div>
  </section>

  <!-- 학습: 플래시카드 -->
  <section id="cards" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="sectitle"><button class="back" id="back3">‹ 설정</button><h2 id="cTitle"></h2><span class="sub" id="cCount"></span></div>
    <div class="track"><i id="cbar" style="width:0%"></i></div>
    <div class="card fc pop" id="fcard"></div>
    <div class="fcrow"><button class="dont" id="fcDont">다시 볼래요</button><button class="know" id="fcKnow">알아요</button></div>
    <div class="fcrow"><button id="fcPrev">‹ 이전</button><button id="fcFlip">뜻 보기 / 숨기기</button><button id="fcNext">다음 ›</button></div>
  </section>

  <!-- 테스트 -->
  <section id="quiz" hidden>
    <div class="status"><span class="counter" id="counter"></span><span class="stats"><span class="combo" id="combo" hidden></span><span class="hearts" id="hearts"></span><span class="score" id="score">0</span></span></div>
    <div class="track"><i id="bar" style="width:0%"></i></div>
    <div class="timer"><i id="tbar" style="width:100%"></i></div>
    <div class="card qcard" id="qcard"></div>
    <div id="answers" class="answers"></div>
    <div id="feedback" class="feedback"></div>
  </section>

  <!-- 결과 -->
  <section id="result" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="card final" id="finalCard"></div>
    <div class="grid3" id="finalStats"></div>
    <div id="wrongWrap"></div>
    <div class="btnrow" id="againRow"></div>
  </section>

  <p class="foot">Ryan's Edge English, 호민쌤단어장</p>
</div>

<script>
const LIBRARY = /*__LIBRARY__*/[];


const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { const b = a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const BEST_KEY = "hominssam.vocab.best.v1";
const VIEWS = ["home","setup","study","cards","quiz","result"];
// ── 홈 화면 앱 설치(PWA): GitHub Pages 주소에서 열었을 때만 동작 ──
let INSTALL_OK = false, deferredPrompt = null;
(function(){
  const hosted = /github\.io$/.test(location.hostname);
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if(!hosted || standalone) return;
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  let dismissed = false; try { dismissed = localStorage.getItem("installDismissed") === "1"; } catch(e) {}
  if(dismissed) return;
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const txt = $("installTxt");
  if(ios){
    txt.innerHTML = "<b>휴대폰에 앱으로 설치하기</b>Safari 아래 <b style='display:inline'>공유</b> 버튼(네모에 화살표) → <b style='display:inline'>홈 화면에 추가</b>를 누르면 앱 아이콘이 생깁니다.";
    INSTALL_OK = true;
  } else {
    txt.innerHTML = "<b>휴대폰에 앱으로 설치하기</b>브라우저 메뉴(⋮ 또는 ≡) → <b style='display:inline'>홈 화면에 추가</b>(또는 앱 설치)를 누르면 앱 아이콘이 생깁니다.";
    INSTALL_OK = true;
    window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; txt.innerHTML = "<b>휴대폰에 앱으로 설치하기</b>홈 화면에 아이콘을 추가하면 앱처럼 바로 열립니다."; $("installBtn").hidden = false; });
    $("installBtn").addEventListener("click", async () => { if(!deferredPrompt) return; deferredPrompt.prompt(); const r = await deferredPrompt.userChoice; deferredPrompt = null; if(r.outcome === "accepted"){ INSTALL_OK = false; $("installBar").hidden = true; } });
  }
  $("installX").addEventListener("click", () => { INSTALL_OK = false; $("installBar").hidden = true; try { localStorage.setItem("installDismissed", "1"); } catch(e) {} });
  window.addEventListener("appinstalled", () => { INSTALL_OK = false; $("installBar").hidden = true; });
})();

function show(v){ VIEWS.forEach(x => $(x).hidden = x !== v); $("installBar").hidden = !(v === "home" && INSTALL_OK); window.scrollTo({top:0}); }

const ACTS = { list:{label:"학습 (단어 목록)", hint:"단어 목록을 보며 뜻과 영영풀이를 익힙니다. 항목을 누르면 뜻을 가리거나 보일 수 있습니다."},
               cards:{label:"학습 (플래시카드)", hint:"카드를 넘기며 외웁니다. '다시 볼래요'로 표시한 단어만 다시 돌릴 수 있습니다."},
               test:{label:"테스트", hint:"문제를 풀며 점수와 최고 기록에 도전합니다."} };
const MODES = { en2ko:{label:"영어 → 뜻", hint:"영어 단어를 보고 알맞은 우리말 뜻을 고릅니다."},
                ko2en:{label:"뜻 → 영어", hint:"우리말 뜻을 보고 알맞은 영어 단어를 고릅니다."},
                def:{label:"영영풀이 → 영어", hint:"영어 뜻풀이를 읽고 알맞은 영어 단어를 고릅니다."},
                spell:{label:"철자 쓰기", hint:"뜻과 첫 글자를 보고 단어를 직접 입력합니다. 한 단어짜리 표제어만 출제됩니다."} };
const LENS = [10, 20, 30, 0];
const cfg = { mat:null, group:"전체", act:"test", mode:"en2ko", len:20, timer:true };

/* ── 자료 목록 ── */
function renderHome(){
  const h = $("home"); h.innerHTML = "";
  const intro = document.createElement("p"); intro.className = "hint"; intro.style.margin = "0 2px";
  intro.textContent = "학습할 자료를 고르세요. 자료는 계속 추가됩니다.";
  h.appendChild(intro);
  let q = "";
  if(LIBRARY.length > 6){
    const inp = document.createElement("input"); inp.type = "search"; inp.className = "search"; inp.placeholder = "자료 찾기 (예: 지학사, 10월, 3과)";
    inp.value = HOME_Q; inp.addEventListener("input", () => { HOME_Q = inp.value; renderList(); });
    h.appendChild(inp);
  }
  const list = document.createElement("div"); list.className = "lib"; h.appendChild(list);
  function renderList(){
    list.innerHTML = "";
    const kw = HOME_Q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const items = LIBRARY.filter(m => kw.every(k => ((m.title || "") + " " + (m.subtitle || "")).toLowerCase().includes(k)));
    if(!items.length){ const e = document.createElement("p"); e.className = "hint"; e.textContent = "찾는 자료가 없습니다."; list.appendChild(e); return; }
    items.forEach(m => {
      const n = m.groups ? m.groups.reduce((s,g) => s + g.words.length, 0) : (m.words || 0);
      const gn = m.groups ? m.groups.length : (m.ranges || 0);
      const b = document.createElement("button"); b.className = "mat"; b.type = "button";
      b.innerHTML = '<span class="mt">' + esc(m.title) + '</span>' + (m.subtitle ? '<span class="ms">' + esc(m.subtitle) + '</span>' : '') +
        '<span class="mn">단어 ' + n + '개 | ' + gn + '개 범위' + (m.added ? ' | ' + esc(m.added) : '') + '</span>';
      b.addEventListener("click", () => openMaterial(m.id, true));
      list.appendChild(b);
    });
  }
  renderList();
}
let HOME_Q = "";
async function loadMaterial(m){
  if(m.groups) return true;
  try {
    const r = await fetch(m.file + "?v=" + Math.floor(Date.now() / 600000)); if(!r.ok) throw 0;
    m.groups = await r.json(); return true;
  } catch(err){ const e = document.createElement("p"); e.className = "hint"; e.style.color = "var(--bad)"; e.textContent = "자료를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 눌러 주세요."; $("home").prepend(e); setTimeout(() => e.remove(), 4000); return false; }
}
async function openMaterial(id, push){
  const m = LIBRARY.find(x => x.id === id); if(!m) return;
  if(!m.groups){ document.body.style.cursor = "progress"; const ok = await loadMaterial(m); document.body.style.cursor = ""; if(!ok) return; }
  cfg.mat = m; cfg.group = "전체";
  if(push) history.replaceState(null, "", "#" + encodeURIComponent(id));
  $("mTitle").textContent = m.title; $("mSub").textContent = m.subtitle || "";
  renderSetup(); show("setup");
}
function chip(text, on, fn){ const b=document.createElement("button"); b.className="chip"; b.type="button"; b.textContent=text; b.setAttribute("aria-pressed", on?"true":"false"); b.addEventListener("click", fn); return b; }
function allWords(m){ return m.groups.flatMap(g => g.words.map(w => Object.assign({g:g.name}, w))); }
function poolFor(){
  let p = cfg.group === "전체" ? allWords(cfg.mat) : (cfg.mat.groups.find(g => g.name === cfg.group) || {words:[]}).words.map(w => Object.assign({g:cfg.group}, w));
  if(cfg.act === "test"){
    if(cfg.mode === "spell") p = p.filter(x => /^[a-zA-Z-]+$/.test(x.w));
    if(cfg.mode === "def") p = p.filter(x => x.e);
    if(cfg.group === "전체"){ const seen=new Set(); p = p.filter(x => { const k=x.w.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; }); }
  }
  return p;
}
function renderSetup(){
  const m = cfg.mat;
  const gr = $("pickGroup"); gr.innerHTML = "";
  gr.parentElement.hidden = m.groups.length < 2;
  gr.appendChild(chip("전체 " + allWords(m).length, cfg.group==="전체", () => { cfg.group="전체"; renderSetup(); }));
  m.groups.forEach(g => gr.appendChild(chip(g.name + " " + g.words.length, cfg.group===g.name, () => { cfg.group=g.name; renderSetup(); })));
  const ac = $("pickAct"); ac.innerHTML = "";
  Object.keys(ACTS).forEach(k => ac.appendChild(chip(ACTS[k].label, cfg.act===k, () => { cfg.act=k; renderSetup(); })));
  $("actHint").textContent = ACTS[cfg.act].hint;
  $("testOpts").hidden = cfg.act !== "test";
  if(cfg.act === "test"){
    const md = $("pickMode"); md.innerHTML = "";
    Object.keys(MODES).forEach(k => md.appendChild(chip(MODES[k].label, cfg.mode===k, () => { cfg.mode=k; renderSetup(); })));
    $("modeHint").textContent = MODES[cfg.mode].hint;
    const pool = poolFor().length;
    const l = $("pickLen"); l.innerHTML = "";
    if(cfg.len && cfg.len > pool) cfg.len = 0;
    LENS.forEach(n => { if(n && n > pool) return; l.appendChild(chip(n ? n + "문제" : "전체 " + pool + "문제", cfg.len===n, () => { cfg.len=n; renderSetup(); })); });
    const t = $("pickTimer"); t.innerHTML = "";
    t.appendChild(chip("10초 제한", cfg.timer===true, () => { cfg.timer=true; renderSetup(); }));
    t.appendChild(chip("시간 무제한", cfg.timer===false, () => { cfg.timer=false; renderSetup(); }));
    const best = store.get(BEST_KEY, {})[bestKey()];
    $("bestLine").innerHTML = best ? '최고 기록 <b>' + best.score + '점</b> | 정답률 ' + best.rate + '%' : '<span>아직 기록이 없습니다. 첫 기록을 세워 보세요.</span>';
  }
  $("startBtn").textContent = cfg.act === "test" ? "테스트 시작" : "학습 시작";
}
function bestKey(){ return [cfg.mat.id, cfg.group, cfg.mode, cfg.len, cfg.timer].join("|"); }

/* ── 학습: 목록 ── */
let listHidden = false, listItems = [];
function startList(){
  listItems = poolFor(); listHidden = false;
  $("sTitle").textContent = cfg.mat.title + " | " + cfg.group;
  renderList(); show("study");
}
function renderList(){
  $("sCount").textContent = listItems.length + "개";
  $("toggleAll").textContent = listHidden ? "뜻 모두 보기" : "뜻 모두 가리기";
  const wl = $("wordList"); wl.innerHTML = "";
  listItems.forEach(x => {
    const d = document.createElement("div"); d.className = "wi" + (listHidden ? " hide" : ""); d.setAttribute("role","button"); d.tabIndex = 0;
    d.innerHTML = '<span class="w">' + esc(x.w) + '</span><span class="p">' + esc(x.p || "") + '</span>' +
      '<span class="k">' + esc(x.k) + '</span>' + (x.e ? '<span class="e">' + esc(x.e) + '</span>' : '') +
      (cfg.group === "전체" ? '<span class="g">' + esc(x.g) + '</span>' : '');
    const tog = () => d.classList.toggle("hide");
    d.addEventListener("click", tog); d.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); tog(); } });
    wl.appendChild(d);
  });
}
$("toggleAll").addEventListener("click", () => { listHidden = !listHidden; renderList(); });
$("shuffleList").addEventListener("click", () => { listItems = shuffle(listItems); renderList(); });

/* ── 학습: 플래시카드 ── */
let fc = null;
function startCards(items){
  fc = { q: items || shuffle(poolFor()), i:0, open:false, again:[] };
  $("cTitle").textContent = cfg.mat.title + " | " + cfg.group;
  renderCard(); show("cards");
}
function renderCard(){
  const it = fc.q[fc.i];
  $("cCount").textContent = (fc.i+1) + " / " + fc.q.length;
  $("cbar").style.width = (fc.i / fc.q.length * 100) + "%";
  const c = $("fcard"); c.className = "card fc pop";
  c.innerHTML = '<span class="qkind">' + esc(it.g) + (it.p ? ' | ' + esc(it.p) : '') + '</span><p class="big">' + esc(it.w) + '</p>' +
    (fc.open ? '<p class="ko">' + esc(it.k) + '</p>' + (it.e ? '<p class="def">' + esc(it.e) + '</p>' : '') : '<span class="tap">카드를 누르면 뜻이 보입니다</span>');
}
function cardStep(d){
  if(fc.i + d >= fc.q.length){ finishCards(); return; }
  fc.i = Math.max(0, fc.i + d); fc.open = false; renderCard();
}
function finishCards(){
  $("quiz").hidden = true; show("result");
  const n = fc.q.length, again = fc.again;
  $("finalCard").innerHTML = '<span class="qkind">' + esc(cfg.mat.title) + ' | ' + esc(cfg.group) + ' | 플래시카드</span><span class="big">' + n + '</span><span class="sub">장을 모두 넘겼습니다' + (again.length ? ' | 다시 볼 단어 ' + again.length + '개' : '') + '</span>';
  $("finalStats").innerHTML = "";
  $("wrongWrap").innerHTML = again.length ? '<div class="card pad"><span class="label" style="display:block;margin-bottom:10px">다시 볼 단어</span><div class="wronglist">' +
      again.map(x => '<div class="wrow"><span class="ww">' + esc(x.w) + '</span><span class="wk">' + (x.p ? x.p + " " : "") + esc(x.k) + '</span>' + (x.e ? '<span class="we">' + esc(x.e) + '</span>' : '') + '</div>').join("") + '</div></div>' : '';
  const row = $("againRow"); row.innerHTML = "";
  if(again.length){ const b=document.createElement("button"); b.className="primary"; b.textContent="다시 볼 단어만 한 번 더"; b.addEventListener("click", () => startCards(shuffle(again))); row.appendChild(b); }
  const b2=document.createElement("button"); b2.textContent="처음부터 다시"; b2.addEventListener("click", () => startCards()); row.appendChild(b2);
  const b3=document.createElement("button"); b3.textContent="설정으로"; b3.addEventListener("click", () => { renderSetup(); show("setup"); }); row.appendChild(b3);
}
$("fcard").addEventListener("click", () => { fc.open = !fc.open; renderCard(); });
$("fcFlip").addEventListener("click", () => { fc.open = !fc.open; renderCard(); });
$("fcPrev").addEventListener("click", () => cardStep(-1));
$("fcNext").addEventListener("click", () => cardStep(1));
$("fcKnow").addEventListener("click", () => cardStep(1));
$("fcDont").addEventListener("click", () => { const it = fc.q[fc.i]; if(!fc.again.includes(it)) fc.again.push(it); cardStep(1); });

/* ── 테스트 ── */
let run = null;
function startQuiz(items){
  const pool = poolFor();
  const q = items || shuffle(pool).slice(0, cfg.len || pool.length);
  if(!q.length) return;
  run = { q, i:0, score:0, combo:0, best:0, lives:3, wrong:[], right:0, pool, t0:0, tid:null, locked:false };
  show("quiz"); ask();
}
function stopTimer(){ if(run && run.tid){ clearInterval(run.tid); run.tid = null; } }
function ask(){
  run.locked = false;
  const it = run.q[run.i];
  $("counter").textContent = (run.i+1) + " / " + run.q.length;
  $("score").textContent = run.score;
  $("hearts").innerHTML = '<span style="color:var(--bad)">' + "♥".repeat(run.lives) + '</span><span style="color:var(--line)">' + "♥".repeat(3-run.lives) + '</span>';
  $("combo").hidden = run.combo < 2; $("combo").textContent = run.combo + "연속";
  $("bar").style.width = (run.i / run.q.length * 100) + "%";
  $("feedback").innerHTML = "";
  const card = $("qcard"); card.className = "card qcard pop";
  const ans = $("answers"); ans.innerHTML = "";
  if(cfg.mode === "spell"){
    const n = it.w.length;
    card.innerHTML = '<span class="qkind">' + esc(it.g) + '</span><p class="qko">' + esc(it.k) + '</p>' + (it.e ? '<p class="qhint">' + esc(it.e) + '</p>' : '') +
      '<span class="blanks">' + it.w[0].toUpperCase() + " " + "_ ".repeat(n-1).trim() + '</span><span class="qpos">' + n + '글자</span>';
    const row = document.createElement("div"); row.className = "spellrow";
    row.innerHTML = '<input id="spellIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + esc(it.w[0]) + '…" aria-label="영어 단어 입력"><button type="button" id="spellGo">확인</button>';
    ans.appendChild(row);
    $("spellGo").addEventListener("click", () => judgeSpell(it));
    $("spellIn").addEventListener("keydown", e => { if(e.key === "Enter") judgeSpell(it); });
    setTimeout(() => $("spellIn").focus(), 30);
  } else {
    const en = cfg.mode === "en2ko";
    const pos = it.p ? '<span class="qpos">' + esc(it.p) + '</span>' : '';
    card.innerHTML = '<span class="qkind">' + esc(it.g) + '</span>' + (en ? '<p class="qword">' + esc(it.w) + '</p>' : cfg.mode === "def" ? '<p class="qdef">' + esc(it.e) + '</p>' : '<p class="qko">' + esc(it.k) + '</p>') + pos;
    const key = en ? "k" : "w";
    const notSame = x => x[key] !== it[key];
    const samePos = run.pool.filter(x => x.g === it.g && x.p === it.p && notSame(x));
    const sameG = run.pool.filter(x => x.g === it.g && notSame(x));
    const anyPos = run.pool.filter(x => x.p === it.p && notSame(x));
    const bank = samePos.length >= 3 ? samePos : anyPos.length >= 3 ? anyPos : sameG.length >= 3 ? sameG : run.pool.filter(notSame);
    const picks = [];
    shuffle(bank).some(x => { if(!picks.some(p => p[key] === x[key])) picks.push(x); return picks.length === 3; });
    shuffle(picks.concat([it])).forEach((o, idx) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "ans";
      b.innerHTML = '<span class="key">' + (idx+1) + '</span><span>' + esc(o[key]) + '</span>';
      b.addEventListener("click", () => judgePick(it, o, key));
      ans.appendChild(b);
    });
  }
  stopTimer();
  const tb = $("tbar");
  if(cfg.timer){
    run.t0 = Date.now(); tb.parentElement.style.background = "var(--accent-soft)"; tb.style.width = "100%";
    run.tid = setInterval(() => { const left = 1 - (Date.now() - run.t0) / 10000; tb.style.width = Math.max(0, left*100) + "%"; if(left <= 0){ stopTimer(); timeUp(it); } }, 60);
  } else { tb.parentElement.style.background = "transparent"; tb.style.width = "0%"; }
}
function judgePick(it, chosen, key){
  if(run.locked) return; run.locked = true; stopTimer();
  const ok = chosen[key] === it[key];
  [...$("answers").children].forEach(b => { b.disabled = true; const t = b.lastElementChild.textContent; if(t === it[key]) b.classList.add("is-good"); else if(!ok && t === chosen[key]) b.classList.add("is-bad"); });
  settle(it, ok);
}
function judgeSpell(it){
  if(run.locked) return;
  const v = ($("spellIn").value || "").trim().toLowerCase(); if(!v) return;
  run.locked = true; stopTimer(); $("spellIn").disabled = true; $("spellGo").disabled = true;
  settle(it, v === it.w.toLowerCase());
}
function timeUp(it){
  if(run.locked) return; run.locked = true;
  [...$("answers").children].forEach(b => { b.disabled = true; if(b.lastElementChild && b.lastElementChild.textContent === it[cfg.mode === "en2ko" ? "k" : "w"]) b.classList.add("is-good"); });
  const inp = $("spellIn"); if(inp){ inp.disabled = true; $("spellGo").disabled = true; }
  settle(it, false, true);
}
function settle(it, ok, timedOut){
  const fb = $("feedback");
  const body = '<span class="vb"><b>' + esc(it.w) + '</b> ' + (it.p ? esc(it.p) + " " : "") + esc(it.k) + '</span>' + (it.e ? '<span class="ve">' + esc(it.e) + '</span>' : '');
  if(ok){
    run.right++; run.combo++; run.best = Math.max(run.best, run.combo);
    const speed = cfg.timer ? Math.max(0, 5 - Math.floor((Date.now() - run.t0) / 2000)) : 0;
    run.score += 10 + Math.min(run.combo - 1, 5) * 2 + speed;
    fb.innerHTML = '<div class="verdict good"><span class="vt">정답</span>' + body + '</div>';
  } else {
    run.combo = 0; run.lives--; run.wrong.push(it);
    fb.innerHTML = '<div class="verdict bad"><span class="vt">' + (timedOut ? "시간 초과" : "오답") + '</span>' + body + '</div>';
  }
  $("score").textContent = run.score;
  const nb = document.createElement("button"); nb.className = "next"; nb.type = "button";
  const last = run.i === run.q.length - 1 || run.lives <= 0;
  nb.textContent = last ? "결과 보기" : "다음 문제";
  nb.addEventListener("click", advance); fb.appendChild(nb); nb.focus();
}
function advance(){ if(run.lives <= 0 || run.i === run.q.length - 1) return finish(); run.i++; ask(); }
function finish(){
  stopTimer(); show("result");
  const done = run.right + run.wrong.length, rate = done ? Math.round(run.right / done * 100) : 0;
  const key = bestKey(), all = store.get(BEST_KEY, {}), prev = all[key];
  const isBest = !prev || run.score > prev.score;
  if(isBest){ all[key] = {score:run.score, rate}; store.set(BEST_KEY, all); }
  const out = run.lives <= 0;
  $("finalCard").innerHTML = '<span class="qkind">' + esc(cfg.mat.title) + ' | ' + esc(cfg.group) + ' | ' + MODES[cfg.mode].label + '</span><span class="big">' + run.score + '</span>' +
    '<span class="sub">' + (out ? '하트를 모두 잃었습니다 | ' : '') + done + '문제 중 ' + run.right + '문제 정답</span>' + (isBest && run.score > 0 ? '<span class="newbest">최고 기록 경신</span>' : '');
  $("finalStats").innerHTML = '<div class="cell"><div class="n">' + rate + '%</div><div class="t">정답률</div></div><div class="cell"><div class="n">' + run.best + '</div><div class="t">최다 연속</div></div><div class="cell"><div class="n">' + run.wrong.length + '</div><div class="t">오답</div></div>';
  $("wrongWrap").innerHTML = run.wrong.length
    ? '<div class="card pad"><span class="label" style="display:block;margin-bottom:10px">틀린 단어 ' + run.wrong.length + '개</span><div class="wronglist">' +
      run.wrong.map(x => '<div class="wrow"><span class="ww">' + esc(x.w) + '</span><span class="wk">' + (x.p ? esc(x.p) + " " : "") + esc(x.k) + '</span>' + (x.e ? '<span class="we">' + esc(x.e) + '</span>' : '') + '</div>').join("") + '</div></div>'
    : '<div class="card pad" style="text-align:center"><span class="sub" style="color:var(--good);font-weight:600">전부 맞혔습니다.</span></div>';
  const row = $("againRow"); row.innerHTML = "";
  if(run.wrong.length){ const b=document.createElement("button"); b.className="primary"; b.textContent="틀린 단어만 다시"; b.addEventListener("click", () => startQuiz(shuffle(run.wrong))); row.appendChild(b); }
  const b2=document.createElement("button"); b2.textContent="같은 설정으로 다시"; b2.addEventListener("click", () => startQuiz()); row.appendChild(b2);
  const b3=document.createElement("button"); b3.textContent="설정으로"; b3.addEventListener("click", () => { renderSetup(); show("setup"); }); row.appendChild(b3);
}
document.addEventListener("keydown", e => {
  if($("quiz").hidden || !run || run.locked && e.key !== "Enter") return;
  if(/^[1-4]$/.test(e.key) && cfg.mode !== "spell"){ const b = $("answers").children[+e.key - 1]; if(b && !b.disabled) b.click(); }
  else if(e.key === "Enter"){ const n = $("feedback").querySelector(".next"); if(n) n.click(); }
});

$("startBtn").addEventListener("click", () => { if(cfg.act === "list") startList(); else if(cfg.act === "cards") startCards(); else startQuiz(); });
$("back1").addEventListener("click", () => { history.replaceState(null, "", location.pathname); renderHome(); show("home"); });
$("back2").addEventListener("click", () => { renderSetup(); show("setup"); });
$("back3").addEventListener("click", () => { renderSetup(); show("setup"); });
$("brand").addEventListener("click", () => { history.replaceState(null, "", location.pathname); renderHome(); show("home"); });
function boot(){
  renderHome();
  const hashId = decodeURIComponent(location.hash.replace(/^#/, ""));
  if(hashId && LIBRARY.some(m => m.id === hashId)) openMaterial(hashId, false); else show("home");
}
if(LIBRARY.length){ boot(); }
else {
  // 정적 호스팅(GitHub Pages)용: manifest.json → data/<id>.json 을 읽어 자료 목록을 채운다
  const bust = "?v=" + Math.floor(Date.now() / 600000);
  fetch("manifest.json" + bust).then(r => r.json()).then(man => {
    man.forEach(m => LIBRARY.push(Object.assign({}, m)));   // 단어 데이터는 자료를 열 때 그때그때 불러옴
    boot();
  }).catch(() => { $("home").innerHTML = '<p class="hint">자료를 불러오지 못했습니다. 잠시 후 다시 열어 주세요.</p>'; show("home"); });
}
</script>
